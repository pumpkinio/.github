name: Security Scan (Reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Working directory for all commands'
        type: string
        default: '.'
      node-version:
        description: 'Node.js version to use'
        type: string
        default: '20'
      npm-audit:
        description: 'Run npm audit'
        type: boolean
        default: true
      scan-secrets:
        description: 'Run TruffleHog secret scanning'
        type: boolean
        default: true
      audit-level:
        description: 'npm audit failure threshold (low, moderate, high, critical)'
        type: string
        default: 'high'

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout code (full history for secret scanning)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: pumpkinio/.github/actions/setup-node@main
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Run npm audit
        if: ${{ inputs.npm-audit }}
        run: npm audit --audit-level=${{ inputs.audit-level }} --production

      - name: Run TruffleHog secret scan
        if: ${{ inputs.scan-secrets }}
        uses: trufflesecurity/trufflehog@6c05c4a00b91aa542267d8e32a8254774799d68d # v3.93.8
        continue-on-error: true
        with:
          path: ./
          base: ""
          extra_args: --only-verified

      - name: Upload security results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-results
          path: |
            ${{ inputs.working-directory }}/npm-audit.json
            ${{ inputs.working-directory }}/trufflehog-results.json
          if-no-files-found: ignore
          retention-days: 30
