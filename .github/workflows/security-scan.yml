name: Security Scan (Reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Working directory for all commands'
        type: string
        default: '.'
      node-version:
        description: 'Node.js version to use'
        type: string
        default: '20'
      npm-audit:
        description: 'Run npm audit'
        type: boolean
        default: true
      scan-secrets:
        description: 'Run TruffleHog secret scanning'
        type: boolean
        default: true
      audit-level:
        description: 'npm audit failure threshold (low, moderate, high, critical)'
        type: string
        default: 'high'

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout code (full history for secret scanning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        if: ${{ inputs.npm-audit }}
        run: npm audit --audit-level=${{ inputs.audit-level }} --production

      - name: Run TruffleHog secret scan
        if: ${{ inputs.scan-secrets }}
        uses: trufflesecurity/trufflehog@v3.93.8
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      - name: Upload security results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-results
          path: |
            ${{ inputs.working-directory }}/npm-audit.json
            ${{ inputs.working-directory }}/trufflehog-results.json
          if-no-files-found: ignore
          retention-days: 30
