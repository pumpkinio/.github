name: OpenTofu Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment (dev or prod)'
        type: string
        required: true
      working-directory:
        description: 'OpenTofu root module directory (e.g. terraform/dev)'
        type: string
        required: true
      tofu-version:
        description: 'OpenTofu CLI version to install'
        type: string
        required: false
        default: '1.8'
      aws-region:
        description: 'AWS region'
        type: string
        required: false
        default: 'us-east-1'
      plan-only:
        description: 'Generate plan only — skip apply (use on PRs)'
        type: boolean
        required: false
        default: false
      auto-approve:
        description: 'Apply without manual approval gate'
        type: boolean
        required: false
        default: false
    secrets:
      aws-role-arn:
        description: 'IAM Role ARN to assume via OIDC'
        required: true
      tf-sensitive-vars:
        description: 'HCL-formatted sensitive variables (written to .sensitive.auto.tfvars before plan)'
        required: false
    outputs:
      plan-has-changes:
        description: 'true if the plan contains infrastructure changes'
        value: ${{ jobs.terraform.outputs.plan-has-changes }}
      plan-summary:
        description: 'Human-readable summary line from tofu plan'
        value: ${{ jobs.terraform.outputs.plan-summary }}

jobs:
  terraform:
    name: OpenTofu ${{ inputs.plan-only && 'Plan' || 'Apply' }} (${{ inputs.environment }})
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    permissions:
      id-token: write
      contents: read

    outputs:
      plan-has-changes: ${{ steps.plan.outputs.has-changes }}
      plan-summary:     ${{ steps.plan.outputs.summary }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate inputs
        run: |
          if [[ "${{ inputs.environment }}" != "dev" && "${{ inputs.environment }}" != "prod" ]]; then
            echo "::error::Invalid environment '${{ inputs.environment }}'. Must be 'dev' or 'prod'."
            exit 1
          fi
          if [[ ! -d "${{ inputs.working-directory }}" ]]; then
            echo "::error::Working directory '${{ inputs.working-directory }}' does not exist."
            exit 1
          fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Setup OpenTofu ${{ inputs.tofu-version }}
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: ${{ inputs.tofu-version }}

      - name: Write sensitive variables
        env:
          TF_SENSITIVE_VARS: ${{ secrets.tf-sensitive-vars }}
        run: |
          if [ -n "$TF_SENSITIVE_VARS" ]; then
            printf '%s\n' "$TF_SENSITIVE_VARS" > .sensitive.auto.tfvars
          fi

      - name: OpenTofu Init
        run: tofu init -input=false

      - name: OpenTofu Validate
        run: tofu validate

      - name: OpenTofu Format Check
        run: tofu fmt -check -recursive

      - name: OpenTofu Plan
        id: plan
        run: |
          tofu plan -out=tfplan -input=false -detailed-exitcode 2>&1 | tee plan.txt
          EXIT_CODE=${PIPESTATUS[0]}

          # exit code 0 = no changes, 2 = changes present, 1 = error
          if [ "${EXIT_CODE}" -eq 1 ]; then
            echo "OpenTofu plan failed."
            exit 1
          fi

          HAS_CHANGES="false"
          if [ "${EXIT_CODE}" -eq 2 ]; then
            HAS_CHANGES="true"
          fi

          SUMMARY=$(grep -E '^Plan:|^No changes\.' plan.txt | head -1 || echo "See plan output for details.")

          echo "has-changes=${HAS_CHANGES}" >> "$GITHUB_OUTPUT"
          echo "summary=${SUMMARY}"         >> "$GITHUB_OUTPUT"

      - name: Post plan to step summary
        run: |
          echo "### OpenTofu Plan — \`${{ inputs.environment }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ----- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Directory | \`${{ inputs.working-directory }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Has changes | \`${{ steps.plan.outputs.has-changes }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Summary | ${{ steps.plan.outputs.summary }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "<details><summary>Full plan output</summary>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```hcl' >> "$GITHUB_STEP_SUMMARY"
          cat plan.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "</details>" >> "$GITHUB_STEP_SUMMARY"

      - name: OpenTofu Apply (dev or auto-approve)
        if: >-
          inputs.plan-only == false &&
          (inputs.auto-approve == true || inputs.environment == 'dev')
        run: tofu apply -auto-approve -input=false tfplan

      - name: OpenTofu Apply (prod — gated by GitHub Environment)
        if: >-
          inputs.plan-only == false &&
          inputs.auto-approve == false &&
          inputs.environment == 'prod'
        run: |
          echo "Applying to production. Approval was enforced by the GitHub Environment protection rule."
          tofu apply -auto-approve -input=false tfplan
