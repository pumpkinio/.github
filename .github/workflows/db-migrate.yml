name: Database Migrations

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment (dev or prod)'
        type: string
        required: true
      aws-region:
        description: 'AWS region'
        type: string
        required: false
        default: 'us-east-1'
      migrations-directory:
        description: 'Path to directory containing migration .sql files'
        type: string
        required: false
        default: 'database/migrations'
      schema-file:
        description: 'Path to initial schema SQL file'
        type: string
        required: false
        default: 'database/schema.sql'
    secrets:
      aws-role-arn:
        description: 'IAM Role ARN to assume via OIDC'
        required: true
      database-cluster-arn:
        description: 'Aurora cluster ARN for rds-data execute-statement'
        required: true
      database-secret-arn:
        description: 'Secrets Manager ARN holding DB credentials'
        required: true
      database-name:
        description: 'Database name (e.g. pumpkin_trading)'
        required: true

jobs:
  migrate:
    name: Run Migrations (${{ inputs.environment }})
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate inputs
        run: |
          if [[ "${{ inputs.environment }}" != "dev" && "${{ inputs.environment }}" != "prod" ]]; then
            echo "::error::Invalid environment '${{ inputs.environment }}'. Must be 'dev' or 'prod'."
            exit 1
          fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      # ── Bootstrap: ensure schema_migrations tracking table exists ──────────
      - name: Check if schema_migrations table exists
        id: check-table
        run: |
          RESULT=$(aws rds-data execute-statement \
            --resource-arn "${{ secrets.database-cluster-arn }}" \
            --secret-arn   "${{ secrets.database-secret-arn }}" \
            --database     "${{ secrets.database-name }}" \
            --sql "SELECT EXISTS (SELECT FROM information_schema.tables WHERE table_name = 'schema_migrations')" \
            --query 'records[0][0].booleanValue' \
            --output text)
          echo "table-exists=${RESULT}" >> "$GITHUB_OUTPUT"

      - name: Create schema_migrations table if missing
        if: steps.check-table.outputs.table-exists != 'true'
        run: |
          echo "schema_migrations table not found — creating..."
          aws rds-data execute-statement \
            --resource-arn "${{ secrets.database-cluster-arn }}" \
            --secret-arn   "${{ secrets.database-secret-arn }}" \
            --database     "${{ secrets.database-name }}" \
            --sql "CREATE TABLE IF NOT EXISTS schema_migrations (
                     version    TEXT        PRIMARY KEY,
                     applied_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
                   )"
          echo "schema_migrations table created."

      # ── Run migrations ──────────────────────────────────────────────────────
      - name: Run pending migrations
        id: run-migrations
        run: |
          MIGRATIONS_DIR="${{ inputs.migrations-directory }}"
          CLUSTER_ARN="${{ secrets.database-cluster-arn }}"
          SECRET_ARN="${{ secrets.database-secret-arn }}"
          DB_NAME="${{ secrets.database-name }}"

          if [ ! -d "${MIGRATIONS_DIR}" ]; then
            echo "Migrations directory '${MIGRATIONS_DIR}' not found — nothing to run."
            echo "applied-count=0"  >> "$GITHUB_OUTPUT"
            echo "applied-versions=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          APPLIED_COUNT=0
          APPLIED_VERSIONS=""

          # Iterate over .sql files sorted lexicographically (filename order = version order)
          while IFS= read -r -d '' MIGRATION_FILE; do
            FILENAME=$(basename "${MIGRATION_FILE}")

            # Extract version prefix: everything up to the first non-digit character
            # e.g. "002-rate-limit-entries.sql" -> "002"
            VERSION=$(echo "${FILENAME}" | grep -oE '^[0-9]+')

            if [ -z "${VERSION}" ]; then
              echo "⚠️  Skipping '${FILENAME}': cannot determine version number."
              continue
            fi

            echo "──────────────────────────────────────────"
            echo "Migration: ${FILENAME}  (version=${VERSION})"

            # Check whether this version has already been applied
            EXISTING=$(aws rds-data execute-statement \
              --resource-arn "${CLUSTER_ARN}" \
              --secret-arn   "${SECRET_ARN}" \
              --database     "${DB_NAME}" \
              --sql          "SELECT version FROM schema_migrations WHERE version = :version" \
              --parameters   "[{\"name\":\"version\",\"value\":{\"stringValue\":\"${VERSION}\"}}]" \
              --query        'records[0][0].stringValue' \
              --output       text 2>/dev/null || true)

            if [ "${EXISTING}" = "${VERSION}" ]; then
              echo "✓ Already applied — skipping."
              continue
            fi

            # Each migration applies atomically, so a failure half way through
            # cannot leave the schema partly changed with nothing recorded in
            # schema_migrations — which previously meant the next run replayed
            # statements that had already committed.
            #
            # CREATE INDEX CONCURRENTLY (and VACUUM, and CREATE DATABASE) cannot
            # run inside a transaction block; Postgres rejects them outright.
            # 004-index-optimization.sql is one such migration. Those files run
            # unwrapped, and say so, rather than failing.
            TX_ID=""
            TX_ARG=""
            if grep -qiE 'concurrently|^[[:space:]]*vacuum|create[[:space:]]+database|drop[[:space:]]+database' "${MIGRATION_FILE}"; then
              echo "  ⚠️  Contains statements that cannot run in a transaction — applying unwrapped."
              echo "     A failure part way through this file will leave it half applied."
            else
              TX_ID=$(aws rds-data begin-transaction \
                --resource-arn "${CLUSTER_ARN}" \
                --secret-arn   "${SECRET_ARN}" \
                --database     "${DB_NAME}" \
                --query transactionId --output text)
              if [ -z "${TX_ID}" ] || [ "${TX_ID}" = "None" ]; then
                echo "✗ Could not open a transaction for '${FILENAME}'."
                exit 1
              fi
              TX_ARG="--transaction-id ${TX_ID}"
              echo "  Transaction ${TX_ID}"
            fi
            echo "→ Applying migration..."

            # Aurora Data API cannot execute multiple statements in one call, so
            # the file is split here. Three things this parser has to get right,
            # each of which the previous version got wrong:
            #
            # 1. NEVER pipe SQL through `xargs`. It was used to trim whitespace,
            #    but xargs parses its input as shell words and therefore strips
            #    quotes: `INSERT ... VALUES ('open')` reached Postgres as
            #    `VALUES (open)` — a column reference. Corruption, not a syntax
            #    error, so some statements became valid-but-different SQL.
            #
            # 2. A line ending in `;` is not always a statement boundary. Inside
            #    a dollar-quoted block — DO $$ ... END $$;, CREATE FUNCTION,
            #    trigger bodies — semicolons are part of the body. 16 of this
            #    repo's 41 migrations contain such a block, so splitting on them
            #    cut two in five migrations mid-body. DOLLAR_DEPTH tracks it.
            #
            # 3. Comments are only skipped outside a block. A `--` line inside a
            #    function body is part of the body.
            STMT_NUM=0
            CURRENT_STMT=""
            DOLLAR_DEPTH=0

            while IFS= read -r LINE || [ -n "$LINE" ]; do
              TRIMMED="$(printf '%s' "$LINE" | sed 's/^[[:space:]]*//')"

              if [ "${DOLLAR_DEPTH}" -eq 0 ]; then
                case "$TRIMMED" in
                  --*) continue ;;
                  '')  continue ;;
                esac
              fi

              if [ -z "$CURRENT_STMT" ]; then
                CURRENT_STMT="$LINE"
              else
                CURRENT_STMT="${CURRENT_STMT}
${LINE}"
              fi

              # Each unpaired $$ on a line flips in/out of a dollar-quoted body.
              DOLLARS="$(printf '%s' "$LINE" | grep -o '[$][$]' | wc -l | tr -d '[:space:]')"
              if [ $((DOLLARS % 2)) -eq 1 ]; then
                DOLLAR_DEPTH=$((1 - DOLLAR_DEPTH))
              fi

              case "$TRIMMED" in
                *\;)
                  [ "${DOLLAR_DEPTH}" -ne 0 ] && continue

                  # Trim surrounding whitespace and the trailing semicolon
                  # without touching anything between the quotes.
                  STMT="$(printf '%s' "$CURRENT_STMT" \
                    | sed -e '$ s/[[:space:]]*;[[:space:]]*$//' \
                          -e '1 s/^[[:space:]]*//' \
                          -e '$ s/[[:space:]]*$//')"
                  CURRENT_STMT=""
                  [ -z "$STMT" ] && continue

                  STMT_NUM=$((STMT_NUM + 1))
                  echo "  Statement ${STMT_NUM}: $(printf '%s' "$STMT" | tr '\n' ' ' | head -c 80)..."

                  if ! aws rds-data execute-statement \
                      --resource-arn "${CLUSTER_ARN}" \
                      --secret-arn   "${SECRET_ARN}" \
                      --database     "${DB_NAME}" \
                      ${TX_ARG} \
                      --sql          "${STMT}" >/dev/null; then
                    echo "✗ Migration '${FILENAME}' statement ${STMT_NUM} FAILED."
                    if [ -n "${TX_ID}" ]; then
                      echo "  Rolling back — nothing from this migration is applied."
                      aws rds-data rollback-transaction \
                        --resource-arn "${CLUSTER_ARN}" \
                        --secret-arn   "${SECRET_ARN}" \
                        --transaction-id "${TX_ID}" >/dev/null || true
                    else
                      echo "  ⚠️  This migration ran outside a transaction (CONCURRENTLY);"
                      echo "     earlier statements in it are already committed."
                    fi
                    exit 1
                  fi
                  ;;
              esac
            done < "${MIGRATION_FILE}"

            # A migration that produced no statements has done nothing, and
            # recording it as applied is worse than failing: the schema stops
            # matching what schema_migrations claims, and nobody finds out until
            # someone tries to rebuild the database from the repo.
            #
            # This is not hypothetical. 014-token-price-history.sql, 015-kyc.sql
            # and 017-pool-betting.sql contain no statement terminators at all,
            # so the previous parser found no semicolons, executed nothing, and
            # recorded all three as applied. Their tables exist in production
            # only because something other than the runner created them, and
            # they are not in schema.sql either — so a rebuild from this repo
            # would silently produce a different database.
            if [ "${STMT_NUM}" -eq 0 ]; then
              echo "✗ '${FILENAME}' produced no executable statements."
              echo "  Every statement must be terminated with a semicolon."
              echo "  Refusing to record it as applied."
              if [ -n "${TX_ID}" ]; then
                aws rds-data rollback-transaction \
                  --resource-arn "${CLUSTER_ARN}" --secret-arn "${SECRET_ARN}" \
                  --transaction-id "${TX_ID}" >/dev/null || true
              fi
              exit 1
            fi

            # Anything still buffered here never hit a terminator, so it was
            # never executed. Silently dropping it is how a migration applies
            # partially and still gets recorded as done — the failure mode this
            # whole rewrite exists to remove. The commonest cause is a trailing
            # comment after the semicolon, which leaves the line not ending in
            # `;`:
            #
            #   CREATE TABLE t (id int);  -- set up for 019
            #
            # Put the comment on its own line above the statement.
            LEFTOVER="$(printf '%s' "$CURRENT_STMT" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [ -n "${LEFTOVER}" ]; then
              echo "✗ '${FILENAME}' ends with an unterminated statement:"
              printf '%s\n' "${LEFTOVER}" | head -3 | sed 's/^/    /'
              echo "  Every statement must end in a semicolon, with nothing after it on that line."
              if [ -n "${TX_ID}" ]; then
                aws rds-data rollback-transaction \
                  --resource-arn "${CLUSTER_ARN}" --secret-arn "${SECRET_ARN}" \
                  --transaction-id "${TX_ID}" >/dev/null || true
              fi
              exit 1
            fi

            if [ "${DOLLAR_DEPTH}" -ne 0 ]; then
              echo "✗ '${FILENAME}' ends inside an unterminated dollar-quoted block."
              [ -n "${TX_ID}" ] && aws rds-data rollback-transaction \
                --resource-arn "${CLUSTER_ARN}" --secret-arn "${SECRET_ARN}" \
                --transaction-id "${TX_ID}" >/dev/null || true
              exit 1
            fi
            # The version row is written inside the same transaction as the
            # migration itself. Outside it, a commit that succeeded followed by a
            # failed INSERT would leave the schema changed and the migration
            # looking unapplied, so the next run would replay it.
            if ! aws rds-data execute-statement \
                --resource-arn "${CLUSTER_ARN}" \
                --secret-arn   "${SECRET_ARN}" \
                --database     "${DB_NAME}" \
                ${TX_ARG} \
                --sql          "INSERT INTO schema_migrations (version) VALUES (:version)" \
                --parameters   "[{\"name\":\"version\",\"value\":{\"stringValue\":\"${VERSION}\"}}]" >/dev/null; then
              echo "✗ Could not record version ${VERSION}."
              if [ -n "${TX_ID}" ]; then
                aws rds-data rollback-transaction \
                  --resource-arn "${CLUSTER_ARN}" --secret-arn "${SECRET_ARN}" \
                  --transaction-id "${TX_ID}" >/dev/null || true
              fi
              exit 1
            fi

            if [ -n "${TX_ID}" ]; then
              COMMIT_STATUS=$(aws rds-data commit-transaction \
                --resource-arn "${CLUSTER_ARN}" \
                --secret-arn   "${SECRET_ARN}" \
                --transaction-id "${TX_ID}" \
                --query transactionStatus --output text 2>&1) || {
                  echo "✗ Commit failed for '${FILENAME}': ${COMMIT_STATUS}"
                  exit 1
                }
              echo "  Committed (${COMMIT_STATUS})"
            fi

            echo "✓ Migration '${FILENAME}' applied successfully."
            APPLIED_COUNT=$((APPLIED_COUNT + 1))
            APPLIED_VERSIONS="${APPLIED_VERSIONS} ${VERSION}"

          done < <(find "${MIGRATIONS_DIR}" -maxdepth 1 -name '*.sql' ! -name '*.down.sql' -print0 | sort -z)

          echo ""
          echo "═══════════════════════════════════════════"
          echo "Migrations complete."
          echo "  Applied : ${APPLIED_COUNT}"
          echo "  Versions: ${APPLIED_VERSIONS:-none}"
          echo "═══════════════════════════════════════════"

          echo "applied-count=${APPLIED_COUNT}"    >> "$GITHUB_OUTPUT"
          echo "applied-versions=${APPLIED_VERSIONS}" >> "$GITHUB_OUTPUT"

      - name: Summarise migration run
        if: always()
        run: |
          echo "### Database Migration Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ----- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | \`${{ inputs.environment }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Migrations applied | ${{ steps.run-migrations.outputs.applied-count }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Applied versions | \`${{ steps.run-migrations.outputs.applied-versions }}\` |" >> "$GITHUB_STEP_SUMMARY"
