name: Node.js CI (Reusable)

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use'
        type: string
        default: '20'
      working-directory:
        description: 'Working directory for all commands'
        type: string
        default: '.'
      test-command:
        description: 'Command to run tests'
        type: string
        default: 'npm test'
      lint-command:
        description: 'Command to run linter'
        type: string
        default: 'npm run lint'
      install-command:
        description: 'Command to install dependencies'
        type: string
        default: 'npm ci'
      typecheck-command:
        description: 'Command to run type checking (skipped if empty)'
        type: string
        default: ''

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Run lint
        run: ${{ inputs.lint-command }}

      - name: Run type checking
        if: ${{ inputs.typecheck-command != '' }}
        run: ${{ inputs.typecheck-command }}

      - name: Run tests
        run: ${{ inputs.test-command }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: |
            ${{ inputs.working-directory }}/coverage/
            ${{ inputs.working-directory }}/test-results/
          if-no-files-found: ignore
          retention-days: 14
