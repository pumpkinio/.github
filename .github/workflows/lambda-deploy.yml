name: Deploy Lambda Functions

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment (dev or prod)'
        type: string
        required: true
      aws-region:
        description: 'AWS region'
        type: string
        default: 'us-east-1'
      functions-directory:
        description: 'Path to the directory containing Lambda function subdirectories'
        type: string
        required: true
      shared-directory:
        description: 'Path to the shared modules directory'
        type: string
        default: 'services/api/shared'
      function-prefix:
        description: 'Prefix for Lambda function names (e.g., pumpkin-dev- or pumpkin-prod-)'
        type: string
        required: true
      node-version:
        description: 'Node.js version to use'
        type: string
        default: '20'
      exclude-dirs:
        description: 'Comma-separated list of subdirectory names to skip'
        type: string
        default: 'shared,__tests__,node_modules'
      include-functions:
        description: 'Comma-separated list of function names to deploy (empty = all)'
        type: string
        default: ''
      max-parallel:
        description: 'Max parallel Lambda deployments'
        type: number
        default: 4
    secrets:
      aws-role-arn:
        description: 'ARN of the IAM role to assume via OIDC'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Lambda Functions (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate inputs
        run: |
          if [[ "${{ inputs.environment }}" != "dev" && "${{ inputs.environment }}" != "prod" ]]; then
            echo "::error::Invalid environment '${{ inputs.environment }}'. Must be 'dev' or 'prod'."
            exit 1
          fi
          if [[ ! -d "${{ inputs.functions-directory }}" ]]; then
            echo "::error::Functions directory '${{ inputs.functions-directory }}' does not exist."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Set up Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Discover and deploy Lambda functions
        shell: bash
        run: |
          set -euo pipefail

          FUNCTIONS_DIR="${{ inputs.functions-directory }}"
          SHARED_DIR="${{ inputs.shared-directory }}"
          FUNCTION_PREFIX="${{ inputs.function-prefix }}"
          EXCLUDE_DIRS="${{ inputs.exclude-dirs }}"
          INCLUDE_FUNCTIONS="${{ inputs.include-functions }}"
          MAX_PARALLEL=${{ inputs.max-parallel }}

          # Build exclusion map
          IFS=',' read -ra EXCLUDE_ARRAY <<< "$EXCLUDE_DIRS"
          declare -A EXCLUDE_MAP
          for dir in "${EXCLUDE_ARRAY[@]}"; do
            trimmed="$(echo "$dir" | xargs)"
            EXCLUDE_MAP["$trimmed"]=1
          done

          # Build inclusion map (if specified)
          declare -A INCLUDE_MAP
          INCLUDE_FILTER=false
          if [[ -n "$INCLUDE_FUNCTIONS" ]]; then
            INCLUDE_FILTER=true
            IFS=',' read -ra INCLUDE_ARRAY <<< "$INCLUDE_FUNCTIONS"
            for fn in "${INCLUDE_ARRAY[@]}"; do
              trimmed="$(echo "$fn" | xargs)"
              INCLUDE_MAP["$trimmed"]=1
            done
            echo "Selective deploy: ${#INCLUDE_ARRAY[@]} function(s) requested"
          fi

          # Collect function directories
          FUNCTION_DIRS=()
          while IFS= read -r -d '' entry; do
            dirname="$(basename "$entry")"
            if [[ -n "${EXCLUDE_MAP[$dirname]+_}" ]]; then
              continue
            fi
            if [[ "$INCLUDE_FILTER" == "true" && -z "${INCLUDE_MAP[$dirname]+_}" ]]; then
              continue
            fi
            FUNCTION_DIRS+=("$entry")
          done < <(find "$FUNCTIONS_DIR" -mindepth 1 -maxdepth 1 -type d -print0 | sort -z)

          if [[ ${#FUNCTION_DIRS[@]} -eq 0 ]]; then
            echo "::error::No function directories found to deploy"
            exit 1
          fi

          echo "Deploying ${#FUNCTION_DIRS[@]} function(s) (max $MAX_PARALLEL parallel):"
          for fn_dir in "${FUNCTION_DIRS[@]}"; do
            echo "  - $(basename "$fn_dir")"
          done

          # Create work and log directories
          WORK_DIR="$(mktemp -d)"
          LOG_DIR="$(mktemp -d)"
          trap 'rm -rf "$WORK_DIR" "$LOG_DIR"' EXIT

          # ── Build shared node_modules ONCE (skip 30+ redundant npm installs) ──
          SHARED_DEPS_DIR="$WORK_DIR/_shared_deps"
          mkdir -p "$SHARED_DEPS_DIR"

          if [[ -f "$FUNCTIONS_DIR/package.json" ]]; then
            cp "$FUNCTIONS_DIR/package.json" "$SHARED_DEPS_DIR/package.json"
            [[ -f "$FUNCTIONS_DIR/package-lock.json" ]] && cp "$FUNCTIONS_DIR/package-lock.json" "$SHARED_DEPS_DIR/package-lock.json"
          elif [[ -f "package.json" ]]; then
            cp "package.json" "$SHARED_DEPS_DIR/package.json"
          fi

          if [[ -f "$SHARED_DEPS_DIR/package.json" ]]; then
            echo "Installing shared production dependencies (once for all functions)..."
            (cd "$SHARED_DEPS_DIR" && npm install --omit=dev --no-audit --no-fund 2>&1 | tail -3)
          fi

          # Deploy function (called per-function, runs in background)
          deploy_function() {
            local fn_dir="$1"
            local fn_name="$(basename "$fn_dir")"
            local lambda_name="${FUNCTION_PREFIX}${fn_name}"
            local build_dir="$WORK_DIR/$fn_name"
            local zip_path="$WORK_DIR/${fn_name}.zip"
            local log_file="$LOG_DIR/${fn_name}.log"
            local START_TIME=$(date +%s)

            {
              set -euo pipefail

              mkdir -p "$build_dir/$fn_name"

              # Copy handler source files
              find "$fn_dir" -maxdepth 1 \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) -exec cp {} "$build_dir/$fn_name/" \;
              # Copy subdirectories
              find "$fn_dir" -mindepth 1 -maxdepth 1 -type d \
                -not -name node_modules -not -name __tests__ -exec cp -r {} "$build_dir/$fn_name/" \;

              # Copy shared directory
              if [[ -d "$SHARED_DIR" ]]; then
                cp -r "$SHARED_DIR" "$build_dir/shared"
              fi

              # Use function-local package.json if exists, else reuse shared deps
              if [[ -f "$fn_dir/package.json" ]]; then
                cp "$fn_dir/package.json" "$build_dir/package.json"
                [[ -f "$fn_dir/package-lock.json" ]] && cp "$fn_dir/package-lock.json" "$build_dir/package-lock.json"
                (cd "$build_dir" && npm install --omit=dev --no-audit --no-fund 2>&1 | tail -1)
              elif [[ -d "$SHARED_DEPS_DIR/node_modules" ]]; then
                cp -r "$SHARED_DEPS_DIR/node_modules" "$build_dir/node_modules"
                [[ -f "$SHARED_DEPS_DIR/package.json" ]] && cp "$SHARED_DEPS_DIR/package.json" "$build_dir/package.json"
              fi

              # Package into zip
              (cd "$build_dir" && zip -qr "$zip_path" .)
              ZIP_SIZE=$(du -sh "$zip_path" | cut -f1)
              echo "  Package: $ZIP_SIZE"

              # Deploy to Lambda
              aws lambda update-function-code \
                --function-name "$lambda_name" \
                --zip-file "fileb://$zip_path" \
                --region "${{ inputs.aws-region }}" \
                --output json \
                | jq -r '"  CodeSize: \(.CodeSize) bytes"'

              aws lambda wait function-updated \
                --function-name "$lambda_name" \
                --region "${{ inputs.aws-region }}"

              # Only update handler if it differs (saves ~5s wait per Lambda)
              local CURRENT_HANDLER
              CURRENT_HANDLER=$(aws lambda get-function-configuration \
                --function-name "$lambda_name" \
                --region "${{ inputs.aws-region }}" \
                --query 'Handler' --output text 2>/dev/null || echo "")
              local NEW_HANDLER="$fn_name/$fn_name.handler"

              if [[ "$CURRENT_HANDLER" != "$NEW_HANDLER" ]]; then
                aws lambda update-function-configuration \
                  --function-name "$lambda_name" \
                  --handler "$NEW_HANDLER" \
                  --region "${{ inputs.aws-region }}" \
                  --output json | jq -r '"  Handler: \(.Handler)"'
                aws lambda wait function-updated \
                  --function-name "$lambda_name" \
                  --region "${{ inputs.aws-region }}"
              fi

              local END_TIME=$(date +%s)
              local ELAPSED=$((END_TIME - START_TIME))
              echo "OK deployed in ${ELAPSED}s"
            } > "$log_file" 2>&1

            return $?
          }

          # Parallel deploy with concurrency control
          PIDS=()
          FN_NAMES=()
          ACTIVE=0

          for fn_dir in "${FUNCTION_DIRS[@]}"; do
            fn_name="$(basename "$fn_dir")"

            # Wait if at max concurrency
            while [[ $ACTIVE -ge $MAX_PARALLEL ]]; do
              # Wait for any child to finish
              wait -n 2>/dev/null || true
              ACTIVE=$((ACTIVE - 1))
            done

            echo "Starting: ${FUNCTION_PREFIX}${fn_name}"
            deploy_function "$fn_dir" &
            PIDS+=($!)
            FN_NAMES+=("$fn_name")
            ACTIVE=$((ACTIVE + 1))
          done

          # Wait for all remaining jobs
          FAILED_FUNCTIONS=()
          DEPLOYED_FUNCTIONS=()

          for i in "${!PIDS[@]}"; do
            pid="${PIDS[$i]}"
            fn_name="${FN_NAMES[$i]}"
            lambda_name="${FUNCTION_PREFIX}${fn_name}"
            log_file="$LOG_DIR/${fn_name}.log"

            if wait "$pid"; then
              echo "[OK] $lambda_name"
              DEPLOYED_FUNCTIONS+=("$lambda_name")
            else
              echo "[FAIL] $lambda_name"
              FAILED_FUNCTIONS+=("$lambda_name")
            fi

            # Print log output
            if [[ -f "$log_file" ]]; then
              sed "s/^/  [$fn_name] /" "$log_file"
            fi
          done

          # Summary
          echo ""
          echo "=========================================="
          echo "Deployment Summary"
          echo "=========================================="
          echo "Succeeded: ${#DEPLOYED_FUNCTIONS[@]}"
          echo "Failed: ${#FAILED_FUNCTIONS[@]}"

          if [[ ${#FAILED_FUNCTIONS[@]} -gt 0 ]]; then
            echo ""
            for fn in "${FAILED_FUNCTIONS[@]}"; do
              echo "  [FAIL] $fn"
            done
            echo ""
            echo "::error::${#FAILED_FUNCTIONS[@]} function(s) failed to deploy."
            exit 1
          else
            echo "All ${#DEPLOYED_FUNCTIONS[@]} function(s) deployed successfully."
          fi
