name: Setup Node.js with Dependencies
description: >
  Sets up Node.js, restores cached node_modules, and installs dependencies via npm ci.
  Use this composite action as a consistent entrypoint for all Node.js jobs.

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: '20'
  working-directory:
    description: Directory in which to run npm ci
    required: false
    default: '.'
  install-directory:
    description: Directory containing package-lock.json (defaults to working-directory; set to repo root for npm workspaces)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.install-directory || inputs.working-directory }}/package-lock.json

    - name: Cache node_modules
      id: cache-node-modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ inputs.install-directory || inputs.working-directory }}/node_modules
        key: node-modules-${{ inputs.node-version }}-${{ hashFiles(format('{0}/package-lock.json', inputs.install-directory || inputs.working-directory)) }}
        restore-keys: |
          node-modules-${{ inputs.node-version }}-

    - name: Install dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.install-directory || inputs.working-directory }}
      run: npm ci --prefer-offline --no-audit
